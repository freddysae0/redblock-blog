# Nginx + PHP-FPM + Postgres + Redis
services:
  web:
    build:
      context: .
      dockerfile: docker/nginx/Dockerfile
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "8888:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - .:/var/www/html:ro
    restart: unless-stopped
    networks:
      - appnet

  app:
    build:
      context: .
      dockerfile: Dockerfile.fpm
      args:
        APP_ENV: ${APP_ENV:-local}
    environment: &app-env
      APP_ENV: ${APP_ENV:-production}
      APP_KEY: ${APP_KEY}
      APP_URL: ${APP_URL}
      VIEW_COMPILED_PATH: /var/www/html/storage/framework/views
      DB_CONNECTION: ${DB_CONNECTION:-pgsql}
      DB_HOST: db
      DB_PORT: ${DB_PORT:-5432}
      DB_DATABASE: ${DB_DATABASE}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_HOST: redis
      MAIL_MAILER: ${MAIL_MAILER}
      MAIL_SCHEME: ${MAIL_SCHEME}
      MAIL_HOST: ${MAIL_HOST}
      MAIL_PORT: ${MAIL_PORT}
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME}
    volumes:
      - .:/var/www/html
    networks:
      - appnet
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 9000 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    command: >
      sh -lc '
        set -e
        
        # Wait for database
        sleep 5
        
        # Migrate with retries
        for i in $(seq 1 30); do
          php artisan migrate --force && break || echo "Retrying migration...";
          sleep 3;
        done
        
        # Setup directories and permissions
        mkdir -p resources/views storage/framework/{cache,sessions,views} bootstrap/cache
        rm -f bootstrap/cache/{services.php,packages.php} 2>/dev/null || true
        chown -R www-data:www-data storage bootstrap/cache
        chmod -R ug+rw storage bootstrap/cache
        
        # Clear caches
        php artisan cache:clear config:clear event:clear route:clear clear-compiled || true
        
        # Cache in production only
        if [ "$$APP_ENV" = "production" ] && [ -n "$$APP_KEY" ]; then
          php artisan config:cache route:cache || true
        fi
        
        exec php-fpm -F
      '
    depends_on:
      - db
      - redis
    restart: unless-stopped

  queue:
    build:
      context: .
      dockerfile: Dockerfile.fpm
      args:
        APP_ENV: ${APP_ENV:-local}
    environment: *app-env
    volumes:
      - .:/var/www/html
    command: >
      sh -lc '
        set -e
        
        # Wait for app to be ready
        sleep 10
        
        # Setup directories and permissions
        mkdir -p resources/views storage/framework/{cache,sessions,views} bootstrap/cache
        rm -f bootstrap/cache/{services.php,packages.php} 2>/dev/null || true
        chown -R www-data:www-data storage bootstrap/cache
        chmod -R ug+rw storage bootstrap/cache
        
        # Clear caches
        php artisan cache:clear config:clear event:clear route:clear clear-compiled || true
        
        # Start queue worker
        exec php artisan queue:work --no-interaction --tries=3 --timeout=90
      '
    depends_on:
      - db
      - redis
      - app
    restart: unless-stopped
    networks:
      - appnet

  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_DATABASE}
    volumes:
      - db_data:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - appnet

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    restart: unless-stopped
    networks:
      - appnet

volumes:
  db_data:
  redis_data:

networks:
  appnet: