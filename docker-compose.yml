# Nginx + PHP-FPM + Postgres + Redis
services:
  web:
    build:
      context: .
      dockerfile: docker/nginx/Dockerfile
    depends_on:
      - app
    ports:
      - "8888:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - .:/var/www/html:ro
    restart: unless-stopped
    networks:
      - appnet

  app:
    build:
      context: .
      dockerfile: Dockerfile.fpm
      args:
        APP_ENV: ${APP_ENV:-local}
    environment: &app-env
      APP_ENV: ${APP_ENV:-production}
      APP_KEY: ${APP_KEY}
      APP_URL: ${APP_URL}
      APP_NAME: ${APP_NAME}
      VIEW_COMPILED_PATH: /var/www/html/storage/framework/views
      DB_CONNECTION: ${DB_CONNECTION:-pgsql}
      DB_HOST: db
      DB_PORT: ${DB_PORT:-5432}
      DB_DATABASE: ${DB_DATABASE}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_HOST: redis
      MAIL_MAILER: ${MAIL_MAILER}
      MAIL_SCHEME: ${MAIL_SCHEME}
      MAIL_HOST: ${MAIL_HOST}
      MAIL_PORT: ${MAIL_PORT}
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME}
      MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS}
    volumes:
      - .:/var/www/html
    networks:
      - appnet
    command: >
      sh -c '
        set -e
        echo "Creating .env file..."
        echo "APP_NAME=\"${APP_NAME}\"" > .env
        echo "APP_ENV=${APP_ENV}" >> .env
        
        if [ -z "${APP_KEY}" ]; then
            echo "WARNING: APP_KEY is missing! Generating one..."
            echo "APP_KEY=base64:$(openssl rand -base64 32)" >> .env
        else
            echo "APP_KEY=${APP_KEY}" >> .env
        fi
        
        echo "APP_DEBUG=true" >> .env
        echo "APP_URL=${APP_URL}" >> .env
        echo "DB_CONNECTION=${DB_CONNECTION}" >> .env
        echo "DB_HOST=${DB_HOST}" >> .env
        echo "DB_PORT=${DB_PORT}" >> .env
        echo "DB_DATABASE=${DB_DATABASE}" >> .env
        echo "DB_USERNAME=${DB_USERNAME}" >> .env
        echo "DB_PASSWORD=${DB_PASSWORD}" >> .env
        echo "REDIS_HOST=${REDIS_HOST}" >> .env
        echo "MAIL_MAILER=${MAIL_MAILER}" >> .env
        echo "MAIL_SCHEME=${MAIL_SCHEME}" >> .env
        echo "MAIL_HOST=${MAIL_HOST}" >> .env
        echo "MAIL_PORT=${MAIL_PORT}" >> .env
        echo "MAIL_USERNAME=${MAIL_USERNAME}" >> .env
        echo "MAIL_PASSWORD=${MAIL_PASSWORD}" >> .env
        echo "MAIL_FROM_ADDRESS=\"${MAIL_FROM_ADDRESS}\"" >> .env
        echo "MAIL_FROM_NAME=\"${MAIL_FROM_NAME}\"" >> .env
        echo "SESSION_DRIVER=database" >> .env
        echo "QUEUE_CONNECTION=database" >> .env
        echo "CACHE_STORE=database" >> .env
        
        echo "Cleaning previous installation..."
        rm -rf vendor/ bootstrap/cache/*.php || true
        mkdir -p vendor
        
        echo "Installing dependencies..."
        export COMPOSER_PROCESS_TIMEOUT=2000
        if ! COMPOSER_ALLOW_SUPERUSER=1 composer install --no-dev --optimize-autoloader --no-interaction --prefer-dist; then
          echo "ERROR: Composer install failed!"
          exit 1
        fi
        
        echo "Dependencies installed successfully!"
        
        echo "Installing Node dependencies and building assets..."
        if [ ! -d "node_modules" ]; then
            npm install
        fi
        
        echo "Cleaning build directory..."
        rm -rf public/build
        
        echo "Building assets..."
        npm run build
        rm -f public/hot
        
        echo "Build complete. Manifest content:"
        cat public/build/manifest.json || echo "Manifest not found!"
        echo "Assets directory:"
        ls -la public/build/assets || echo "Assets directory not found!"
        
        sleep 5
        echo "Running migrations..."
        migration_success=false
        for i in $(seq 1 30); do
          if php artisan migrate --force; then
            migration_success=true
            echo "Migrations completed successfully!"
            break
          fi
          echo "Migration attempt $i failed, retrying in 3s...";
          sleep 3;
        done
        
        if [ "$migration_success" = false ]; then
          echo "ERROR: Migrations failed after 30 attempts!"
          echo "Checking database connection..."
          php artisan db:show || true
          exit 1
        fi
        echo "Setting up directories..."
        mkdir -p storage/framework/{cache,sessions,views} bootstrap/cache
        chown -R www-data:www-data storage bootstrap/cache public/build
        chmod -R ug+rw storage bootstrap/cache public/build
        echo "Clearing caches..."
        php artisan cache:clear || true
        php artisan config:clear || true
        php artisan view:clear || true
        echo "Starting PHP-FPM..."
        exec php-fpm -F
      '
    depends_on:
      - db
      - redis
    restart: unless-stopped

  queue:
    build:
      context: .
      dockerfile: Dockerfile.fpm
      args:
        APP_ENV: ${APP_ENV:-local}
    environment: *app-env
    volumes:
      - .:/var/www/html
    command: >
      sh -c '
        set -e
        echo "Creating .env file..."
        echo "APP_NAME=\"${APP_NAME}\"" > .env
        echo "APP_ENV=${APP_ENV}" >> .env
        echo "APP_KEY=${APP_KEY}" >> .env
        echo "APP_DEBUG=false" >> .env
        echo "APP_URL=${APP_URL}" >> .env
        echo "DB_CONNECTION=${DB_CONNECTION}" >> .env
        echo "DB_HOST=${DB_HOST}" >> .env
        echo "DB_PORT=${DB_PORT}" >> .env
        echo "DB_DATABASE=${DB_DATABASE}" >> .env
        echo "DB_USERNAME=${DB_USERNAME}" >> .env
        echo "DB_PASSWORD=${DB_PASSWORD}" >> .env
        echo "REDIS_HOST=${REDIS_HOST}" >> .env
        echo "MAIL_MAILER=${MAIL_MAILER}" >> .env
        echo "MAIL_SCHEME=${MAIL_SCHEME}" >> .env
        echo "MAIL_HOST=${MAIL_HOST}" >> .env
        echo "MAIL_PORT=${MAIL_PORT}" >> .env
        echo "MAIL_USERNAME=${MAIL_USERNAME}" >> .env
        echo "MAIL_PASSWORD=${MAIL_PASSWORD}" >> .env
        echo "MAIL_FROM_ADDRESS=\"${MAIL_FROM_ADDRESS}\"" >> .env
        echo "MAIL_FROM_NAME=\"${MAIL_FROM_NAME}\"" >> .env
        echo "SESSION_DRIVER=database" >> .env
        echo "QUEUE_CONNECTION=database" >> .env
        echo "CACHE_STORE=database" >> .env
        
        echo "Cleaning previous installation..."
        rm -rf vendor/ bootstrap/cache/*.php || true
        
        echo "Installing dependencies..."
        COMPOSER_ALLOW_SUPERUSER=1 composer install --no-dev --optimize-autoloader --no-interaction --prefer-dist
        
        echo "Waiting for app to be ready..."
        sleep 15
        
        echo "Setting up directories..."
        mkdir -p storage/framework/{cache,sessions,views} bootstrap/cache
        chown -R www-data:www-data storage bootstrap/cache
        chmod -R ug+rw storage bootstrap/cache
        
        echo "Starting queue worker..."
        exec php artisan queue:work --tries=3 --timeout=90
      '
    depends_on:
      - db
      - redis
      - app
    restart: unless-stopped
    networks:
      - appnet

  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_DATABASE}
    volumes:
      - db_data:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - appnet

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    restart: unless-stopped
    networks:
      - appnet

volumes:
  db_data:
  redis_data:


networks:
  appnet:
